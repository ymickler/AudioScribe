name: AudioScribe Release CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '!app/**/*.md'
      - 'gradle/**'
      - '!gradle/**/*.md'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'
      - '!**/*.md'
      - '!LICENSE'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Custom Version (e.g. 1.2.3, optional - overrides Release Type)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Extract App Name
        id: app_info
        run: |
          APP_NAME=$(grep "rootProject.name" settings.gradle.kts | cut -d '"' -f 2)
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Generate Version Tag
        id: versioning
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Fetch all tags to determine the latest release tag
          git fetch --tags --force || true
          
          # Get the latest tag, default to v1.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Latest tag found: $LATEST_TAG"
          
          # Strip the leading 'v' if present
          VERSION_CLEAN=${LATEST_TAG#v}
          
          # Split into major, minor, patch
          IFS='.' read -r major minor patch <<< "$VERSION_CLEAN"
          
          # Set fallbacks if parsing fails
          major=${major:-1}
          minor=${minor:-0}
          patch=${patch:-0}
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual workflow dispatch
            if [ -n "${{ github.event.inputs.custom_version }}" ]; then
              VERSION="v${{ github.event.inputs.custom_version }}"
              echo "Using custom version: $VERSION"
            else
              RELEASE_TYPE="${{ github.event.inputs.release_type }}"
              echo "Release type selected: $RELEASE_TYPE"
              if [ "$RELEASE_TYPE" = "major" ]; then
                major=$((major + 1))
                minor=0
                patch=0
              elif [ "$RELEASE_TYPE" = "minor" ]; then
                minor=$((minor + 1))
                patch=0
              else
                patch=$((patch + 1))
              fi
              VERSION="v$major.$minor.$patch"
            fi
          else
            # Triggered automatically on push to main: detect change type via conventional commit message
            echo "Commit message: $COMMIT_MSG"
            
            RELEASE_TYPE="patch"
            if echo "$COMMIT_MSG" | grep -Ei "BREAKING CHANGE|breaking[:(]" || echo "$COMMIT_MSG" | grep -Ei "^[a-z]+(\([a-z0-9_-]+\))?!:" ; then
              RELEASE_TYPE="major"
            elif echo "$COMMIT_MSG" | grep -Ei "^feat[:(]" ; then
              RELEASE_TYPE="minor"
            fi
            
            echo "Auto-detected release type: $RELEASE_TYPE"
            if [ "$RELEASE_TYPE" = "major" ]; then
              major=$((major + 1))
              minor=0
              patch=0
            elif [ "$RELEASE_TYPE" = "minor" ]; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi
            VERSION="v$major.$minor.$patch"
          fi
          
          echo "Generated version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag_name=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: |
          VERSION_NUM="${{ env.VERSION }}"
          VERSION_NUM="${VERSION_NUM#v}"
          ./gradlew :app:assembleRelease -PversionName="$VERSION_NUM" --stacktrace

      - name: Prepare Release Asset
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/${{ env.APP_NAME }}-release.apk release-artifacts/${{ env.APP_NAME }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.APP_NAME }} ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: release-artifacts/${{ env.APP_NAME }}.apk
          body: |
            ## ${{ env.APP_NAME }} Release ${{ env.VERSION }}
            
            This release was automatically generated by GitHub Actions.
            
            ### Features
            - **Local-first transcription**: Voice message transcribing optimized for German & English, fully offline by default.
            - **Optional server transcription**: Offload to a self-hosted server for faster/higher-quality results, with automatic fallback to the local offline engine if it's unreachable. Off by default; no server URL is ever hardcoded.
            - **Flexible Display Modes**: Swap between floating HUD overlay or standard system notifications.
            - **Smart settings**: Persists preferred transcription language and (if enabled) server settings locally.
            
            ### Download
            - Download the direct APK file: [**${{ env.APP_NAME }}.apk**](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.APP_NAME }}.apk)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
